version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - python -m pip install -r requirements.txt
  build:
    commands:
      - python -m pytest -q
artifacts:
  files:
    - '**/*'
  exclude-paths:
    - '.git/**/*'
    - '.pytest_cache/**/*'
    - '__pycache__/**/*'
    - 'tests/**/*'
    - '*.db'
    - 'instance/**/*'
